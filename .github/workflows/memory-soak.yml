name: finite-memory-soak
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Finite synthetic soak duration (30..3600 seconds)'
        default: '600'
        required: true
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: HTTP SSE and real SQLite churn
        env:
          SCYLLASCOPE_SOAK_SECONDS: ${{ inputs.seconds }}
          GOMEMLIMIT: 128MiB
        run: |
          [[ "$SCYLLASCOPE_SOAK_SECONDS" =~ ^[0-9]+$ ]]
          (( SCYLLASCOPE_SOAK_SECONDS >= 30 && SCYLLASCOPE_SOAK_SECONDS <= 3600 ))
          mkdir -p test-results
          set -o pipefail
          go test -timeout=70m -count=1 -v ./internal/api ./tests/runtime -run 'TestSoakRuntime|TestSQLiteIncidentSoak' | tee test-results/soak.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-soak-synthetic-data
          path: test-results/
