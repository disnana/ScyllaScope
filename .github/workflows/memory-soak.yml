name: finite-memory-soak
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Finite synthetic soak duration (60..3600 seconds)'
        default: '3600'
        required: true
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: HTTP SSE and real SQLite churn
        env:
          SCYLLASCOPE_SOAK_SECONDS: ${{ inputs.seconds }}
          SCYLLASCOPE_LONG_SECONDS: ${{ inputs.seconds }}
          SCYLLASCOPE_LONG_OUTPUT: ${{ github.workspace }}/test-results/long
          GOMEMLIMIT: 128MiB
        run: |
          [[ "$SCYLLASCOPE_SOAK_SECONDS" =~ ^[0-9]+$ ]]
          (( SCYLLASCOPE_SOAK_SECONDS >= 60 && SCYLLASCOPE_SOAK_SECONDS <= 3600 ))
          mkdir -p test-results
          set -o pipefail
          go test -p 3 -timeout=70m -count=1 -v ./internal/api ./tests/runtime ./internal/monitor -run 'TestSoakRuntime|TestSQLiteIncidentSoak|TestLongCollectorSoak' | tee test-results/soak.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-soak-synthetic-data
          path: |
            test-results/soak.txt
            test-results/long/samples.jsonl
            test-results/long/*.heap
